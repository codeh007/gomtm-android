<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>gomtm-android</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="hero card">
      <p class="eyebrow">Single Web Host</p>
      <h1>gomtm-android</h1>
      <p class="lead">这个宿主现在只保留一个 WebView。这里负责节点接入、诊断和跳转到外部 gomtmui 页面。</p>
      <p class="hint">打开外部页面后，使用系统返回键即可回到这里。</p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>节点配置</h2>
        <button id="saveButton" class="button ghost" type="button">保存配置</button>
      </div>

      <label class="field">
        <span>Bootstrap 地址</span>
        <textarea id="bootstrapInput" rows="3" spellcheck="false"></textarea>
      </label>

      <label class="field">
        <span>节点名称</span>
        <input id="nodeNameInput" type="text" spellcheck="false" />
      </label>

      <label class="field">
        <span>gomtmui URL</span>
        <input id="consoleUrlInput" type="text" inputmode="url" spellcheck="false" placeholder="https://gomtm.example.com/dash/p2p" />
      </label>

      <div class="actions">
        <button id="startButton" class="button primary" type="button">启动节点</button>
        <button id="stopButton" class="button" type="button">停止节点</button>
        <button id="openAccessibilityButton" class="button" type="button">打开无障碍设置</button>
        <button id="openConsoleButton" class="button accent" type="button">打开 gomtmui</button>
      </div>
    </section>

    <section class="status-grid">
      <article class="card metric">
        <span class="label">运行状态</span>
        <strong id="stateValue">-</strong>
      </article>
      <article class="card metric">
        <span class="label">Peer ID</span>
        <strong id="peerValue">-</strong>
      </article>
      <article class="card metric">
        <span class="label">已连接 Bootstrap</span>
        <strong id="bootstrapValue">-</strong>
      </article>
      <article class="card metric">
        <span class="label">Bridge 类</span>
        <strong id="bridgeValue">-</strong>
      </article>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>权限状态</h2>
        <button id="refreshButton" class="button ghost" type="button">刷新状态</button>
      </div>
      <div class="kv-list">
        <div>
          <span class="label">无障碍</span>
          <strong id="accessibilityValue">-</strong>
        </div>
        <div>
          <span class="label">截图</span>
          <strong id="screenCaptureValue">-</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>已发现节点</h2>
      <pre id="peersValue" class="pre"></pre>
    </section>

    <section class="card">
      <h2>错误</h2>
      <pre id="errorValue" class="pre"></pre>
    </section>

    <section class="card">
      <h2>最近日志</h2>
      <pre id="logsValue" class="pre"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>

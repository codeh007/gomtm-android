<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>gomtm-swarm</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="hero card">
      <div class="hero-layout">
        <div class="hero-copy">
          <h1>gomtm-swarm</h1>
        </div>

        <div class="hero-status" aria-label="节点状态摘要">
          <div class="hero-status-head">
            <span class="label">当前节点状态</span>
            <strong id="stateValue" class="status-pill" data-state-tone="neutral">-</strong>
          </div>

          <div class="hero-status-list">
            <div class="hero-status-row">
              <span class="label">Peer ID</span>
              <strong id="peerValue">-</strong>
            </div>
            <div class="hero-status-row">
              <span class="label">已连接 Bootstrap</span>
              <strong id="bootstrapValue">-</strong>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>节点配置</h2>
      </div>

      <label class="field">
        <span>Bootstrap 地址</span>
        <textarea id="bootstrapInput" rows="3" spellcheck="false"></textarea>
        <p id="bootstrapValidationText" class="field-feedback" data-tone="muted"></p>
      </label>

      <label class="field">
        <span>gomtmui URL</span>
        <input id="consoleUrlInput" type="text" inputmode="url" spellcheck="false" placeholder="https://gomtm.example.com/dash/p2p" />
        <p id="consoleUrlValidationText" class="field-feedback" data-tone="muted"></p>
      </label>

      <div id="configDirtyBar" class="config-dirty" data-dirty="false" aria-live="polite">
        <strong id="configDirtyText" class="config-dirty-text" data-state-tone="connected">配置已保存</strong>
        <button id="saveButton" class="button ghost save-button" type="button" hidden>
          <span class="button-inner">
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h9l3 3v9H4z" />
                <path d="M7 4v5h6" />
                <path d="M7 13h6" />
              </svg>
            </span>
            <span id="saveButtonText" class="button-text">保存更改</span>
          </span>
        </button>
      </div>

      <div class="action-groups">
        <section id="runtimeActionGroup" class="action-group" aria-labelledby="runtimeActionGroupTitle">
          <div class="action-group-head">
            <h3 id="runtimeActionGroupTitle">节点运行</h3>
            <strong id="runtimeActionStatus" class="action-status" data-state-tone="neutral">未配置</strong>
          </div>
          <div class="actions action-buttons">
            <button id="startButton" class="button primary" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="currentColor">
                    <path d="M6 4.8v10.4c0 .5.5.8.9.6l7.5-5.2c.4-.3.4-.9 0-1.2L6.9 4.2c-.4-.2-.9.1-.9.6z" />
                  </svg>
                </span>
                <span class="button-text">启动</span>
              </span>
            </button>
            <button id="stopButton" class="button" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="currentColor">
                    <rect x="5" y="5" width="10" height="10" rx="2" />
                  </svg>
                </span>
                <span class="button-text">停止</span>
              </span>
            </button>
          </div>
        </section>

        <section id="permissionActionGroup" class="action-group" aria-labelledby="permissionActionGroupTitle">
          <div class="action-group-head">
            <h3 id="permissionActionGroupTitle">权限授权</h3>
            <strong id="permissionActionStatus" class="action-status" data-state-tone="neutral">需授权</strong>
          </div>
          <div class="actions action-buttons">
            <button id="openAccessibilityButton" class="button" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="4.5" r="1.5" />
                    <path d="M10 7v4" />
                    <path d="M6 9h8" />
                    <path d="M8 11l-2 5" />
                    <path d="M12 11l2 5" />
                  </svg>
                </span>
                <span class="button-text">无障碍</span>
              </span>
            </button>
            <button id="requestScreenCaptureButton" class="button" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="14" height="10" rx="2" />
                    <path d="M8 8l4 2-4 2z" />
                  </svg>
                </span>
                <span class="button-text">截图权限</span>
              </span>
            </button>
          </div>
        </section>

        <section id="consoleActionGroup" class="action-group" aria-labelledby="consoleActionGroupTitle">
          <div class="action-group-head">
            <h3 id="consoleActionGroupTitle">控制台</h3>
            <strong id="consoleActionStatus" class="action-status" data-state-tone="neutral">未配置</strong>
          </div>
          <div class="actions action-buttons">
            <button id="openConsoleButton" class="button accent" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 6l-3 4 3 4" />
                    <path d="M11 14h5" />
                  </svg>
                </span>
                <span class="button-text">打开控制台</span>
              </span>
            </button>
            <button id="openAgentConsoleButton" class="button accent" type="button">
              <span class="button-inner">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 7h8" />
                    <path d="M6 10h5" />
                    <path d="M6 13h3" />
                    <rect x="3.5" y="4" width="13" height="12" rx="2" />
                  </svg>
                </span>
                <span class="button-text">当前节点 Agent</span>
              </span>
            </button>
          </div>
        </section>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>权限与诊断</h2>
        <button id="refreshButton" class="button ghost" type="button">
          <span class="button-inner">
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15.5 7.5A6 6 0 1 0 16 10" />
                <path d="M15 4v4h-4" />
              </svg>
            </span>
            <span class="button-text">刷新</span>
          </span>
        </button>
      </div>
      <div class="kv-list kv-list-triple">
        <div>
          <span class="label">无障碍</span>
          <strong id="accessibilityValue">-</strong>
        </div>
        <div>
          <span class="label">截图</span>
          <strong id="screenCaptureValue">-</strong>
        </div>
        <div>
          <span class="label">Bridge 类</span>
          <strong id="bridgeValue">-</strong>
        </div>
      </div>
    </section>

    <section id="diagnosticsCard" class="card diagnostics-card" data-empty="true">
      <div class="section-head diagnostics-head">
        <div>
          <h2>诊断</h2>
          <p id="diagnosticsSummaryText" class="section-copy diagnostics-summary">当前还没有新的节点、错误或运行日志。</p>
        </div>
      </div>

      <div id="diagnosticsBody" class="diagnostics-body" hidden>
        <section id="diagnosticsPeersSection" class="diagnostic-section" hidden>
          <p class="label">已发现节点</p>
          <pre id="peersValue" class="pre"></pre>
        </section>

        <section id="diagnosticsErrorSection" class="diagnostic-section" hidden>
          <p class="label">错误</p>
          <pre id="errorValue" class="pre"></pre>
        </section>

        <section id="diagnosticsLogsSection" class="diagnostic-section" hidden>
          <p class="label">最近日志</p>
          <pre id="logsValue" class="pre"></pre>
        </section>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>

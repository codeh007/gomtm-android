name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/libs/gomtm-swarm-android.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag override
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pinned gomtm swarm AAR
        uses: ./.github/actions/setup-pinned-gomtm-swarm-aar

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${GOMTM_SWARM_AAR_VERSION}"
          fi
          test -n "${release_tag}" || { echo "Missing release tag and pinned gomtm swarm version." >&2; exit 1; }
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              'gomtm_swarm_aar_url': os.environ['GOMTM_SWARM_AAR_URL'],
              'gomtm_swarm_aar_version': os.environ['GOMTM_SWARM_AAR_VERSION'],
              'gomtm_swarm_aar_sha256': os.environ['GOMTM_SWARM_AAR_SHA256'],
              'gomtm_swarm_metadata_url': os.environ['GOMTM_SWARM_METADATA_URL'],
              'release_tag': os.environ['RELEASE_TAG'],
              'git_commit': os.environ['GITHUB_SHA'],
          }
          Path('dist/gomtm-android-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          ls -lh app/libs dist

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Record APK variant
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output_metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          output_file = output_metadata['elements'][0]['outputFile']
          provenance = json.loads(Path('dist/gomtm-android-provenance.json').read_text())
          provenance['apk_variant'] = 'debug'
          provenance['apk_asset_name'] = output_file
          Path('dist/gomtm-android-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            gomtm-android installable bootstrap APK built from a pinned gomtm swarm AAR.

            APK variant:
            - debug (installable on unsigned/bootstrap test devices)

            gomtm AAR provenance:
            - version: ${{ env.GOMTM_SWARM_AAR_VERSION }}
            - url: ${{ env.GOMTM_SWARM_AAR_URL }}
            - sha256: ${{ env.GOMTM_SWARM_AAR_SHA256 }}
          files: |
            app/build/outputs/apk/debug/*.apk
            dist/gomtm-android-provenance.json
          fail_on_unmatched_files: true

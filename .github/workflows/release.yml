name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create when manually dispatching (must start with v)
        required: false
        type: string
      gomtm_swarm_aar_url:
        description: GitHub API asset URL for gomtm-swarm-android.aar
        required: false
        type: string
      gomtm_swarm_metadata_url:
        description: GitHub API asset URL for gomtm-swarm-android.json
        required: false
        type: string
      gomtm_swarm_aar_version:
        description: Version string for the pinned gomtm swarm AAR
        required: false
        type: string
      gomtm_swarm_aar_sha256:
        description: SHA256 for the pinned gomtm swarm AAR
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  GOMTM_SWARM_AAR_URL: ${{ inputs.gomtm_swarm_aar_url || vars.GOMTM_SWARM_AAR_URL }}
  GOMTM_SWARM_METADATA_URL: ${{ inputs.gomtm_swarm_metadata_url || vars.GOMTM_SWARM_METADATA_URL }}
  GOMTM_SWARM_AAR_VERSION: ${{ inputs.gomtm_swarm_aar_version || vars.GOMTM_SWARM_AAR_VERSION }}
  GOMTM_SWARM_AAR_SHA256: ${{ inputs.gomtm_swarm_aar_sha256 || vars.GOMTM_SWARM_AAR_SHA256 }}
  GOMTM_SWARM_AAR_NAME: gomtm-swarm-android.aar
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}" || { echo "Missing RELEASE_TAG. Push a v* tag or provide workflow_dispatch input release_tag."; exit 1; }
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "RELEASE_TAG must start with v" >&2
              exit 1
              ;;
          esac

      - name: Prepare pinned gomtm swarm AAR
        uses: ./.github/actions/setup-pinned-gomtm-swarm-aar

      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              'gomtm_swarm_aar_url': os.environ['GOMTM_SWARM_AAR_URL'],
              'gomtm_swarm_aar_version': os.environ['GOMTM_SWARM_AAR_VERSION'],
              'gomtm_swarm_aar_sha256': os.environ['GOMTM_SWARM_AAR_SHA256'],
              'gomtm_swarm_metadata_url': os.environ['GOMTM_SWARM_METADATA_URL'],
              'release_tag': os.environ['RELEASE_TAG'],
              'git_commit': os.environ['GITHUB_SHA'],
          }
          Path('dist/gomtm-android-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          ls -lh app/libs dist

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Record APK variant
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          provenance = json.loads(Path('dist/gomtm-android-provenance.json').read_text())
          provenance['apk_variant'] = 'debug'
          provenance['apk_asset_name'] = 'app-debug.apk'
          Path('dist/gomtm-android-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            gomtm-android installable bootstrap APK built from a pinned gomtm swarm AAR.

            APK variant:
            - debug (installable on unsigned/bootstrap test devices)

            gomtm AAR provenance:
            - version: ${{ env.GOMTM_SWARM_AAR_VERSION }}
            - url: ${{ env.GOMTM_SWARM_AAR_URL }}
            - sha256: ${{ env.GOMTM_SWARM_AAR_SHA256 }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/gomtm-android-provenance.json
          fail_on_unmatched_files: true

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare pinned gomtm swarm AAR
        uses: ./.github/actions/setup-pinned-gomtm-swarm-aar

      - name: Create or reuse release tag for current commit
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time

          sha = os.environ['GITHUB_SHA'].strip()
          series_prefix = 'v0.4.'
          exact = re.compile(r'^v0\.4\.(\d+)$')
          act_mode = os.environ.get('ACT') == 'true'

          def git_output(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          def series_tags(*args: str) -> list[str]:
              output = git_output('tag', *args)
              if not output:
                  return []
              return [tag.strip() for tag in output.splitlines() if exact.fullmatch(tag.strip())]

          def version_key(tag: str) -> int:
              match = exact.fullmatch(tag)
              if not match:
                  raise ValueError(f'invalid release tag: {tag}')
              return int(match.group(1))

          def remote_tag_sha(tag: str) -> str:
              return git_output('ls-remote', '--tags', 'origin', f'refs/tags/{tag}')

          subprocess.check_call(['git', 'fetch', '--force', '--tags', 'origin'])

          existing = series_tags('--points-at', sha)
          if existing:
              print(sorted(existing, key=version_key)[-1])
              raise SystemExit(0)

          known = series_tags('--list', f'{series_prefix}*')
          if not known:
              raise SystemExit('No exact v0.4.x release tag found; expected at least one existing tag in that series.')

          if act_mode:
              print(sorted(known, key=version_key)[-1])
              raise SystemExit(0)

          for _ in range(20):
              known = series_tags('--list', f'{series_prefix}*')
              next_patch = version_key(sorted(known, key=version_key)[-1]) + 1
              candidate = f'{series_prefix}{next_patch}'
              subprocess.check_call(['git', 'tag', '-f', candidate, sha])
              push = subprocess.run(['git', 'push', 'origin', f'refs/tags/{candidate}'], text=True, capture_output=True)
              if push.returncode == 0:
                  print(candidate)
                  raise SystemExit(0)
              subprocess.run(['git', 'tag', '-d', candidate], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.check_call(['git', 'fetch', '--force', '--tags', 'origin'])
              existing = series_tags('--points-at', sha)
              if existing:
                  print(sorted(existing, key=version_key)[-1])
                  raise SystemExit(0)
              if remote_tag_sha(candidate):
                  time.sleep(1)
                  continue
              sys.stderr.write(push.stderr)
              raise SystemExit(push.returncode)

          raise SystemExit('failed to allocate release tag after repeated retries')
          PY
          )"
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "GOMTM_RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              'gomtm_swarm_aar_url': os.environ['GOMTM_SWARM_AAR_URL'],
              'gomtm_swarm_aar_version': os.environ['GOMTM_SWARM_AAR_VERSION'],
              'gomtm_swarm_aar_sha256': os.environ['GOMTM_SWARM_AAR_SHA256'],
              'gomtm_swarm_metadata_url': os.environ['GOMTM_SWARM_METADATA_URL'],
              'release_tag': os.environ['RELEASE_TAG'],
              'app_version_name': os.environ['RELEASE_TAG'].removeprefix('v'),
              'git_commit': os.environ['GITHUB_SHA'],
          }
          Path('dist/gomtm-swarm-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          ls -lh app/libs dist

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: bash ./.github/scripts/setup-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks and assemble installable debug APK
        run: ./gradlew --no-daemon -PgomtmReleaseTag="${RELEASE_TAG}" lint testDebugUnitTest assembleDebug

      - name: Prepare named release assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          output_metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          output_file = output_metadata['elements'][0]['outputFile']
          source = Path('app/build/outputs/apk/debug') / output_file
          target = Path('dist/gomtm-swarm-arm64-v8a-debug.apk')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target)

          provenance = json.loads(Path('dist/gomtm-swarm-provenance.json').read_text())
          provenance['apk_variant'] = 'debug'
          provenance['apk_asset_name'] = target.name
          Path('dist/gomtm-swarm-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Create GitHub Release
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: gomtm-swarm ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            gomtm-swarm installable Android app built from a pinned gomtm swarm AAR.

            APK variant:
            - debug (installable on unsigned/bootstrap test devices)

            gomtm AAR provenance:
            - version: ${{ env.GOMTM_SWARM_AAR_VERSION }}
            - url: ${{ env.GOMTM_SWARM_AAR_URL }}
            - sha256: ${{ env.GOMTM_SWARM_AAR_SHA256 }}
          files: |
            dist/gomtm-swarm-arm64-v8a-debug.apk
            dist/gomtm-swarm-provenance.json
          fail_on_unmatched_files: true

      - name: Summarize local act release dry-run
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "ACT local mode: skipped remote GitHub Release creation"
          echo "Release tag: ${RELEASE_TAG}"
          ls -lh dist/gomtm-swarm-arm64-v8a-debug.apk dist/gomtm-swarm-provenance.json

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gomtm_swarm_aar_url:
        description: GitHub API asset URL for gomtm-swarm-android.aar
        required: false
        type: string
      gomtm_swarm_metadata_url:
        description: GitHub API asset URL for gomtm-swarm-android.json
        required: false
        type: string
      gomtm_swarm_aar_version:
        description: Version string for the pinned gomtm swarm AAR
        required: false
        type: string
      gomtm_swarm_aar_sha256:
        description: SHA256 for the pinned gomtm swarm AAR
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.${{ github.run_number }}
  GOMTM_SWARM_AAR_URL: ${{ inputs.gomtm_swarm_aar_url || vars.GOMTM_SWARM_AAR_URL }}
  GOMTM_SWARM_METADATA_URL: ${{ inputs.gomtm_swarm_metadata_url || vars.GOMTM_SWARM_METADATA_URL }}
  GOMTM_SWARM_AAR_VERSION: ${{ inputs.gomtm_swarm_aar_version || vars.GOMTM_SWARM_AAR_VERSION }}
  GOMTM_SWARM_AAR_SHA256: ${{ inputs.gomtm_swarm_aar_sha256 || vars.GOMTM_SWARM_AAR_SHA256 }}
  GOMTM_SWARM_AAR_NAME: gomtm-swarm-android.aar
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gomtm swarm AAR contract
        shell: bash
        run: |
          test -n "${GOMTM_SWARM_AAR_URL}" || { echo "Missing GOMTM_SWARM_AAR_URL"; exit 1; }
          test -n "${GOMTM_SWARM_METADATA_URL}" || { echo "Missing GOMTM_SWARM_METADATA_URL"; exit 1; }
          test -n "${GOMTM_SWARM_AAR_VERSION}" || { echo "Missing GOMTM_SWARM_AAR_VERSION"; exit 1; }
          test -n "${GOMTM_SWARM_AAR_SHA256}" || { echo "Missing GOMTM_SWARM_AAR_SHA256"; exit 1; }

      - name: Download pinned gomtm swarm AAR and metadata
        shell: bash
        run: |
          mkdir -p app/libs dist
          auth_token="${GOMTM_RELEASE_TOKEN:-${GH_FALLBACK_TOKEN}}"
          curl -fsSL -H "Authorization: Bearer ${auth_token}" -H "Accept: application/octet-stream" "${GOMTM_SWARM_AAR_URL}" -o "app/libs/${GOMTM_SWARM_AAR_NAME}"
          curl -fsSL -H "Authorization: Bearer ${auth_token}" -H "Accept: application/octet-stream" "${GOMTM_SWARM_METADATA_URL}" -o "dist/gomtm-swarm-android.json"
          echo "${GOMTM_SWARM_AAR_SHA256}  app/libs/${GOMTM_SWARM_AAR_NAME}" | sha256sum --check --strict --status
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          meta = json.loads(Path('dist/gomtm-swarm-android.json').read_text())
          expected_version = os.environ['GOMTM_SWARM_AAR_VERSION']
          expected_sha = os.environ['GOMTM_SWARM_AAR_SHA256']
          if meta.get('artifact') != 'gomtm-swarm-android.aar':
              raise SystemExit(f"unexpected artifact: {meta.get('artifact')}")
          if meta.get('version') != expected_version:
              raise SystemExit(f"metadata version mismatch: {meta.get('version')} != {expected_version}")
          if meta.get('sha256') != expected_sha:
              raise SystemExit(f"metadata sha256 mismatch: {meta.get('sha256')} != {expected_sha}")
          provenance = {
              'gomtm_swarm_aar_url': os.environ['GOMTM_SWARM_AAR_URL'],
              'gomtm_swarm_aar_version': expected_version,
              'gomtm_swarm_aar_sha256': expected_sha,
              'gomtm_swarm_metadata_url': os.environ['GOMTM_SWARM_METADATA_URL'],
              'release_tag': os.environ['RELEASE_TAG'],
              'git_commit': os.environ['GITHUB_SHA'],
          }
          Path('dist/gomtm-android-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          ls -lh app/libs dist

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            gomtm-android release built from a pinned gomtm swarm AAR.

            gomtm AAR provenance:
            - version: ${{ env.GOMTM_SWARM_AAR_VERSION }}
            - url: ${{ env.GOMTM_SWARM_AAR_URL }}
            - sha256: ${{ env.GOMTM_SWARM_AAR_SHA256 }}
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            dist/gomtm-android-provenance.json
          fail_on_unmatched_files: true

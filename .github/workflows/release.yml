name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gomtm_swarm_aar_url:
        description: Optional direct download URL for a gomtm swarm AAR
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: v0.2.${{ github.run_number }}
  GOMTM_SWARM_AAR_URL: ${{ inputs.gomtm_swarm_aar_url || vars.GOMTM_SWARM_AAR_URL }}
  GOMTM_SWARM_AAR_NAME: ${{ vars.GOMTM_SWARM_AAR_NAME || 'gomtm-swarm-android.aar' }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare optional gomtm swarm AAR
        shell: bash
        run: |
          mkdir -p app/libs
          if [ -z "${GOMTM_SWARM_AAR_URL}" ]; then
            echo "No gomtm swarm AAR configured; releasing the public host shell without a bound runtime."
            exit 0
          fi

          target="app/libs/${GOMTM_SWARM_AAR_NAME:-gomtm-swarm-android.aar}"
          echo "Downloading optional gomtm swarm AAR to ${target}"
          curl -fL --retry 3 --retry-all-errors "${GOMTM_SWARM_AAR_URL}" -o "${target}"
          ls -lh app/libs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            Public gomtm-android release.

            Integration mode:
            - with configured gomtm swarm AAR: bound runtime host
            - without configured gomtm swarm AAR: public host shell only
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: true

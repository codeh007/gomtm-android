name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      gomtm_swarm_aar_url:
        description: Optional direct download URL for a gomtm swarm AAR
        required: false
        type: string

permissions:
  contents: read

env:
  GOMTM_SWARM_AAR_URL: ${{ inputs.gomtm_swarm_aar_url || vars.GOMTM_SWARM_AAR_URL }}
  GOMTM_SWARM_AAR_NAME: ${{ vars.GOMTM_SWARM_AAR_NAME || 'gomtm-swarm-android.aar' }}

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare optional gomtm swarm AAR
        shell: bash
        run: |
          mkdir -p app/libs
          if [ -z "${GOMTM_SWARM_AAR_URL}" ]; then
            echo "No gomtm swarm AAR configured; building the public host shell without a bound runtime."
            exit 0
          fi

          target="app/libs/${GOMTM_SWARM_AAR_NAME:-gomtm-swarm-android.aar}"
          echo "Downloading optional gomtm swarm AAR to ${target}"
          curl -fL --retry 3 --retry-all-errors "${GOMTM_SWARM_AAR_URL}" -o "${target}"
          ls -lh app/libs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      gomtm_swarm_aar_url:
        description: GitHub API asset URL for gomtm-swarm-android.aar
        required: false
        type: string
      gomtm_swarm_metadata_url:
        description: GitHub API asset URL for gomtm-swarm-android.json
        required: false
        type: string
      gomtm_swarm_aar_version:
        description: Version string for the pinned gomtm swarm AAR
        required: false
        type: string
      gomtm_swarm_aar_sha256:
        description: SHA256 for the pinned gomtm swarm AAR
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOMTM_SWARM_AAR_URL: ${{ inputs.gomtm_swarm_aar_url || vars.GOMTM_SWARM_AAR_URL }}
  GOMTM_SWARM_METADATA_URL: ${{ inputs.gomtm_swarm_metadata_url || vars.GOMTM_SWARM_METADATA_URL }}
  GOMTM_SWARM_AAR_VERSION: ${{ inputs.gomtm_swarm_aar_version || vars.GOMTM_SWARM_AAR_VERSION }}
  GOMTM_SWARM_AAR_SHA256: ${{ inputs.gomtm_swarm_aar_sha256 || vars.GOMTM_SWARM_AAR_SHA256 }}
  GOMTM_SWARM_AAR_NAME: gomtm-swarm-android.aar
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pinned gomtm swarm AAR
        uses: ./.github/actions/setup-pinned-gomtm-swarm-aar

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks and assemble debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

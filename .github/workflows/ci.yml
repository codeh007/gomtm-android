name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_FALLBACK_TOKEN: ${{ github.token }}
  GOMTM_RELEASE_TOKEN: ${{ secrets.GOMTM_GH_PAT }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare pinned gomtm swarm AAR
        uses: ./.github/actions/setup-pinned-gomtm-swarm-aar

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks and assemble debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Prepare named debug APK artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          output_metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          output_file = output_metadata['elements'][0]['outputFile']
          source = Path('app/build/outputs/apk/debug') / output_file
          target = Path('dist/gomtm-swarm-arm64-v8a-debug.apk')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target)
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gomtm-swarm-debug-apk
          path: dist/gomtm-swarm-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
